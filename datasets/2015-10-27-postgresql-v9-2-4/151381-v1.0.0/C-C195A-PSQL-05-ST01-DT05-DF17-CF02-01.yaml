description: "Creating test case using base program.\nAdded an environment variable read to the function definition.\nCompleted injection.\n"
io_pair:
  description: "Allocates a buffer of size 16 to copy taint source into.  Checks that the the taint source length is less than 16, but if it is not, returns a -1.  The -1 is silently converted to size_t, which is unsigned, resulting in a huge positive number.  Then copies that many bytes into the buffer of size 16, causing a seg fault. Good inputs: taint source has length less than 16Bad inputs: taint source has greater than or equal to 16\n\n"
  exploits:
    - inputs:
        - stage_enum: 0
          name: FLAUGHTBRED_MEANLESS
          stage: pre_process
          source_enum: 2
          id: source
          ordinal: 1
          value_encoding: none
          value: Heeellllloooooo_Wooooorrrrrllllldddddd!!!!!!
          value_type_enum: 0
          source: env_var_input
          value_type: USE_TEXT_DIRECTLY
    - inputs:
        - source: env_var_input
          value_encoding: none
          value_type_enum: 0
          ordinal: 1
          value: this_string_is_greater_than_16_characters
          name: FLAUGHTBRED_MEANLESS
          stage: pre_process
          stage_enum: 0
          source_enum: 2
          value_type: USE_TEXT_DIRECTLY
          id: source
  base_inputs:
    - source: env_var_input
      source_enum: 2
      stage: pre_process
      stage_enum: 0
      id: source
      ordinal: 1
      name: FLAUGHTBRED_MEANLESS
  benigns:
    - inputs:
        - value_type: USE_TEXT_DIRECTLY
          value_type_enum: 0
          stage: pre_process
          source: env_var_input
          source_enum: 2
          ordinal: 1
          value_encoding: none
          name: FLAUGHTBRED_MEANLESS
          value: Good_Bye_World
          stage_enum: 0
          id: source
    - inputs:
        - stage_enum: 0
          ordinal: 1
          source_enum: 2
          source: env_var_input
          name: FLAUGHTBRED_MEANLESS
          value_encoding: none
          value_type_enum: 0
          value_type: USE_TEXT_DIRECTLY
          id: source
          stage: pre_process
          value: abcd
    - inputs:
        - stage_enum: 0
          name: FLAUGHTBRED_MEANLESS
          value_type: USE_TEXT_DIRECTLY
          source: env_var_input
          stage: pre_process
          source_enum: 2
          id: source
          value_type_enum: 0
