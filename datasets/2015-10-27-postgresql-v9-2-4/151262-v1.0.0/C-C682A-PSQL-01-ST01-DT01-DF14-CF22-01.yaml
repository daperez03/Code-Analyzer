description: "Creating test case using base program.\nAdded an environment variable read to the function definition.\nCompleted injection.\n"
io_pair:
  description: "Read a hex integer from the input.  If hexinteger is negative, ignore.  If hexinteger < 0x0000FFFF, do nothing.  If hexinteger >= 0x0000FFFF try to zero-out the upper two bytes using char pointers.  Perform an incorrect calculation, and rather than zero-ing out the upper two bytes, zero out two different bytes, which corrupts pointers on the stack and results in a seg fault.\n\n"
  benigns:
    - inputs:
        - value_type: USE_TEXT_DIRECTLY
          stage_enum: 0
          ordinal: 1
          value_type_enum: 0
          name: FAROES_HYPOLITE
          value: 10
          stage: pre_process
          id: source
          source: env_var_input
          value_encoding: none
          source_enum: 2
    - inputs:
        - value: 0
          stage_enum: 0
          value_type_enum: 0
          value_type: USE_TEXT_DIRECTLY
          source_enum: 2
          value_encoding: none
          stage: pre_process
          id: source
          ordinal: 1
          source: env_var_input
          name: FAROES_HYPOLITE
    - inputs:
        - source_enum: 2
          stage_enum: 0
          source: env_var_input
          stage: pre_process
          name: FAROES_HYPOLITE
          ordinal: 1
          value: FFFF
          value_type: USE_TEXT_DIRECTLY
          value_encoding: none
          value_type_enum: 0
          id: source
  base_inputs:
    - source: env_var_input
      source_enum: 2
      stage: pre_process
      stage_enum: 0
      id: source
      ordinal: 1
      name: FAROES_HYPOLITE
  exploits:
    - inputs:
        - value_encoding: none
          source: env_var_input
          stage_enum: 0
          name: FAROES_HYPOLITE
          value: 10000
          value_type_enum: 0
          value_type: USE_TEXT_DIRECTLY
          id: source
          stage: pre_process
          ordinal: 1
          source_enum: 2
    - inputs:
        - stage: pre_process
          stage_enum: 0
          source_enum: 2
          source: env_var_input
          value_encoding: none
          ordinal: 1
          id: source
          name: FAROES_HYPOLITE
          value: FFFFFF
          value_type: USE_TEXT_DIRECTLY
          value_type_enum: 0
