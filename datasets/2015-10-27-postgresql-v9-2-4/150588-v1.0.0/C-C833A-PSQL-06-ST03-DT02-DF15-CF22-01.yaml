io_pair:
  description: "This weakness expects a string in the form: '<qsize> <data>' where qsize is the size of the quick sort (used to delay execution), and data is a string containing no spaces.  If the data string contains underscores, spawn two threads - one to replace the underscores with hyphens, and one to capitalize it. The two threads get two separate locks, but they try to obtain them in reverse order.  If the qsort is large enough, these attempts to get the locks will interleave, resulting in deadlock.  In order to hit the weakness, qsize >= 5000000, and the data string must have underscores in it.\n\n"
  benigns:
    - inputs:
        - port: 8887
          source: socket_input
          id: source
          source_enum: 5
          address: ss-localhost
          ordinal: 1
          value_encoding: none
          value_type_enum: 0
          value_type: USE_TEXT_DIRECTLY
          value: 1 /opt/stonesoup/workspace/testData/fifo2 /opt/stonesoup/workspace/testData/fifo1 a_test
          stage_enum: 1
          stage: co_process
        - stage_enum: 0
          source: script_input
          id: background
          ordinal: 2
          name: runFifos.py /opt/stonesoup/workspace/testData/fifo1 /opt/stonesoup/workspace/testData/fifo2
          stage: pre_process
          source_enum: 7
    - inputs:
        - value_type_enum: 0
          stage_enum: 1
          value: 60 /opt/stonesoup/workspace/testData/fifo2 /opt/stonesoup/workspace/testData/fifo1 abigwordwithoutunderscores
          value_type: USE_TEXT_DIRECTLY
          value_encoding: none
          ordinal: 1
          source_enum: 5
          stage: co_process
          source: socket_input
          id: source
          address: ss-localhost
          port: 8887
        - source_enum: 7
          source: script_input
          id: background
          stage: pre_process
          ordinal: 2
          stage_enum: 0
          name: runFifos.py /opt/stonesoup/workspace/testData/fifo1 /opt/stonesoup/workspace/testData/fifo2
    - inputs:
        - stage_enum: 1
          stage: co_process
          value_type_enum: 0
          value_encoding: none
          value_type: USE_TEXT_DIRECTLY
          source: socket_input
          address: ss-localhost
          id: source
          value: 6000000 /opt/stonesoup/workspace/testData/file1 /opt/stonesoup/workspace/testData/file2 another_test
          port: 8887
          ordinal: 1
          source_enum: 5
        - stage: pre_process
          source_enum: 3
          name: /opt/stonesoup/workspace/testData/file1
          ordinal: 2
          stage_enum: 0
          source: file_content_input
        - ordinal: 3
          source_enum: 3
          stage_enum: 0
          source: file_content_input
          name: /opt/stonesoup/workspace/testData/file2
          stage: pre_process
  exploits:
    - inputs:
        - stage_enum: 1
          value_type: USE_TEXT_DIRECTLY
          value_type_enum: 0
          port: 8887
          id: source
          value: 508 /opt/stonesoup/workspace/testData/fifo1 /opt/stonesoup/workspace/testData/fifo2 This_is_a_bad_test.
          value_encoding: none
          source_enum: 5
          stage: co_process
          source: socket_input
          address: ss-localhost
          ordinal: 1
        - ordinal: 2
          id: background
          source_enum: 7
          name: runFifos.py /opt/stonesoup/workspace/testData/fifo1 /opt/stonesoup/workspace/testData/fifo2
          stage: pre_process
          source: script_input
          stage_enum: 0
    - inputs:
        - stage: co_process
          port: 8887
          value_encoding: none
          address: ss-localhost
          value: 99 /opt/stonesoup/workspace/testData/fifo1 /opt/stonesoup/workspace/testData/fifo2 A_NEW_TEST
          ordinal: 1
          id: source
          value_type_enum: 0
          value_type: USE_TEXT_DIRECTLY
          source_enum: 5
          stage_enum: 1
          source: socket_input
        - stage: pre_process
          name: runFifos.py /opt/stonesoup/workspace/testData/fifo1 /opt/stonesoup/workspace/testData/fifo2
          source: script_input
          ordinal: 2
          stage_enum: 0
          source_enum: 7
          id: background
  base_inputs:
    - port: 8887
      source: socket_input
      address: ss-localhost
      id: source
      ordinal: 1
      source_enum: 5
      stage: co_process
      stage_enum: 1
