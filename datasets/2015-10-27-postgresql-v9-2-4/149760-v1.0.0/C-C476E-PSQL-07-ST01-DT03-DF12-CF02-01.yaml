description: "Creating test case using base program.\nAdded an environment variable read to the function definition.\nCompleted injection.\n"
io_pair:
  description: "Good inputs: 1) environment variable is not set. 2) environment variable is set to a filename that exists.Bad input: 1) environment variable is set to a filename that does not exist.\n\n"
  base_inputs:
    - source: env_var_input
      source_enum: 2
      stage: pre_process
      stage_enum: 0
      id: source
      ordinal: 1
      name: GUR_EMPATRON
  exploits:
    - inputs:
        - stage: pre_process
          name: GUR_EMPATRON
          source: env_var_input
          value_encoding: none
          value_type: USE_TEXT_DIRECTLY
          source_enum: 2
          id: source
          ordinal: 1
          value: /opt/stonesoup/workspace/testData/bad01.txt
          stage_enum: 0
          value_type_enum: 0
    - inputs:
        - stage: pre_process
          value_type: USE_TEXT_DIRECTLY
          stage_enum: 0
          value: /opt/stonesoup/workspace/testData/bad02.txt
          value_type_enum: 0
          source: env_var_input
          id: source
          source_enum: 2
          ordinal: 1
          value_encoding: none
          name: GUR_EMPATRON
  benigns:
    - inputs:
        - source_enum: 2
          stage: pre_process
          stage_enum: 0
          source: env_var_input
          name: GUR_EMPATRON
          ordinal: 1
          id: source
          value_type: USE_TEXT_DIRECTLY
          value_type_enum: 0
          value_encoding: none
          value: /opt/stonesoup/workspace/testData/good01.txt
        - stage: pre_process
          source: file_content_input
          value_type: USE_TEXT_DIRECTLY
          ordinal: 2
          source_enum: 3
          stage_enum: 0
          value_encoding: none
          value_type_enum: 0
          value: This file is not empty.
          name: /opt/stonesoup/workspace/testData/good01.txt
    - inputs:
        - stage: pre_process
          name: GUR_EMPATRON
          value_type_enum: 0
          source_enum: 2
          id: source
          stage_enum: 0
          source: env_var_input
          value_type: USE_TEXT_DIRECTLY
          value_encoding: none
          value: /opt/stonesoup/workspace/testData/good02.txt
          ordinal: 1
        - stage_enum: 0
          source_enum: 3
          value: Hello world!  And, good-bye.
          value_type: USE_TEXT_DIRECTLY
          stage: pre_process
          value_encoding: none
          value_type_enum: 0
          name: /opt/stonesoup/workspace/testData/good02.txt
          source: file_content_input
          ordinal: 2
    - inputs:
        - stage_enum: 0
          value_type: USE_TEXT_DIRECTLY
          value_type_enum: 0
          id: source
          source: env_var_input
          ordinal: 1
          name: GUR_EMPATRON
          source_enum: 2
          value: /opt/stonesoup/workspace/testData/good03.txt
          stage: pre_process
          value_encoding: none
        - value: Yet another file.
          value_type_enum: 0
          stage_enum: 0
          value_encoding: none
          name: /opt/stonesoup/workspace/testData/good03.txt
          source: file_content_input
          ordinal: 2
          source_enum: 3
          stage: pre_process
          value_type: USE_TEXT_DIRECTLY
