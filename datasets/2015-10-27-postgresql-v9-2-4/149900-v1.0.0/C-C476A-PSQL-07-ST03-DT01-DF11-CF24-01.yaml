          stage: pre_process
          value: !<!> "\"this\",\"is\",data"
          name: /opt/stonesoup/workspace/testData/bad01.csv
          ordinal: 2
    - inputs:
        - source_enum: 5
          stage: co_process
          source: socket_input
          ordinal: 1
          value_type: USE_TEXT_DIRECTLY
          stage_enum: 1
          id: source
          address: ss-localhost
          value_type_enum: 0
