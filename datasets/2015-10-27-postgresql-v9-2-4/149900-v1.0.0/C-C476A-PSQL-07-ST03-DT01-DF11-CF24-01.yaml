          value_type: USE_TEXT_DIRECTLY
          port: 8887
          source_enum: 5
        - stage: pre_process
          source_enum: 3
          value_type_enum: 0
          value_encoding: none
          value_type: USE_TEXT_DIRECTLY
          stage_enum: 0
          source: file_content_input
