  description: "Reads in a file and determines its size.  If the size is less than 128, checked by a '(max_size - size_of_file) > 0', the file will be read into a buffer of that size and printed out.  An integer underflow can occur if the file is large enough causing a >0 check to pass that should not.  This will cause an overwrite within the fread() function, resulting in Segmentation fault\n\n"
