description: "Creating test case using base program.\nAdded a Socket Server to accept communication from untrusted source.\nCompleted injection.\n"
io_pair:
  base_inputs:
    - stage_enum: 1
      id: source
      ordinal: 1
      address: ss-localhost
      port: 8887
      source: socket_input
      source_enum: 5
      stage: co_process
  description: "This weakness expects a string in the form: '<qsize> <file1> <file2> <data>' where qsize is the size of the quick sort (used to delay execution in certain benign cases), file1 and file2 are files to be read (also to delay execution), and data is a string containing no spaces.  It does a double checked lock which can allow a second thread to return an uninitialized struct while the first thread is in the process of initialization, leading to a null pointer dereference.\n\n"
  benigns:
    - inputs:
        - stage: co_process
          ordinal: 1
          stage_enum: 1
          source: socket_input
          port: 8887
          address: ss-localhost
          value: 5 /opt/stonesoup/workspace/testData/fifo2 /opt/stonesoup/workspace/testData/fifo1 a1s2d3f4
          source_enum: 5
          id: source
          value_type: USE_TEXT_DIRECTLY
          value_encoding: none
          value_type_enum: 0
        - source: script_input
          ordinal: 2
          stage: pre_process
          stage_enum: 0
          name: runFifos.py /opt/stonesoup/workspace/testData/fifo1 /opt/stonesoup/workspace/testData/fifo2
          source_enum: 7
          id: background
    - inputs:
        - port: 8887
          ordinal: 1
          address: ss-localhost
          source: socket_input
          id: source
          stage_enum: 1
          stage: co_process
          source_enum: 5
          value_type: USE_TEXT_DIRECTLY
          value: 25 /opt/stonesoup/workspace/testData/fifo2 /opt/stonesoup/workspace/testData/fifo1 waffles
          value_encoding: none
          value_type_enum: 0
        - stage: pre_process
          stage_enum: 0
          source: script_input
          name: runFifos.py /opt/stonesoup/workspace/testData/fifo1 /opt/stonesoup/workspace/testData/fifo2
          ordinal: 2
          id: background
          source_enum: 7
    - inputs:
        - id: source
          port: 8887
          source: socket_input
          address: ss-localhost
          value_type: USE_TEXT_DIRECTLY
          value_type_enum: 0
          ordinal: 1
          stage_enum: 1
          stage: co_process
          value: 5000000 /opt/stonesoup/workspace/testData/file1 /opt/stonesoup/workspace/testData/file2 bannana.
          value_encoding: none
          source_enum: 5
        - stage_enum: 0
          source: file_content_input
          ordinal: 2
          name: /opt/stonesoup/workspace/testData/file1
          stage: pre_process
          source_enum: 3
        - stage: pre_process
          ordinal: 3
          stage_enum: 0
          name: /opt/stonesoup/workspace/testData/file2
          source_enum: 3
          source: file_content_input
  exploits:
    - inputs:
        - ordinal: 1
          id: source
          stage: co_process
          stage_enum: 1
          value_type_enum: 0
          port: 8887
          source: socket_input
          address: ss-localhost
          source_enum: 5
          value: 50 /opt/stonesoup/workspace/testData/fifo1 /opt/stonesoup/workspace/testData/fifo2 This_will_surely_break_things.
          value_type: USE_TEXT_DIRECTLY
          value_encoding: none
        - source: script_input
          source_enum: 7
          id: background
          name: runFifos.py /opt/stonesoup/workspace/testData/fifo1 /opt/stonesoup/workspace/testData/fifo2
          stage_enum: 0
          stage: pre_process
          ordinal: 2
    - inputs:
        - value: 75 /opt/stonesoup/workspace/testData/fifo1 /opt/stonesoup/workspace/testData/fifo2 asdfasdfasdfasdfasdfasdfasdfasdfasdf
          id: source
          value_type_enum: 0
          ordinal: 1
          address: ss-localhost
          stage_enum: 1
