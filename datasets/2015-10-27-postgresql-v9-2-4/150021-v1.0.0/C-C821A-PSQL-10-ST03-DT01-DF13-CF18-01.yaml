description: "Creating test case using base program.\nAdded a Socket Server to accept communication from untrusted source.\nCompleted injection.\n"
io_pair:
  base_inputs:
    - source: socket_input
      source_enum: 5
      stage: co_process
      stage_enum: 1
      id: source
      ordinal: 1
      address: ss-localhost
      port: 8887
  description: "This weakness expects a string in the form: '<qsize> <file1> <file2> <data>' where qsize is the size of the quick sort (used to delay execution in certan benign cases), file1 and file2 are files used to dealy execution and data is a string containing no spaces. If the input starts with an A and is greater than 50 characters in length, and the qsize is large enough, incorrect syncronization (two separate locks) will lead to division by zero.  For the weakness to occur, the input must begin with an 'A', be greater than 50 characters in length, and file1 and file2 must be FIFO files controlled by runFifo.py fifo1 fifo2.\n\n"
  benigns:
    - inputs:
        - source: socket_input
          source_enum: 5
          stage_enum: 1
          stage: co_process
          address: ss-localhost
          ordinal: 1
          value_type_enum: 0
          port: 8887
          id: source
          value: 5 /opt/stonesoup/workspace/testData/fifo2 /opt/stonesoup/workspace/testData/fifo1 Another_test_case
          value_encoding: none
          value_type: USE_TEXT_DIRECTLY
        - stage: pre_process
          source: script_input
          name: runFifos.py /opt/stonesoup/workspace/testData/fifo1 /opt/stonesoup/workspace/testData/fifo2
          source_enum: 7
          id: background
          stage_enum: 0
          ordinal: 2
    - inputs:
        - value: 1 /opt/stonesoup/workspace/testData/fifo2 /opt/stonesoup/workspace/testData/fifo1 hello_world
          stage_enum: 1
          stage: co_process
          id: source
          ordinal: 1
          address: ss-localhost
          port: 8887
          value_type_enum: 0
          value_type: USE_TEXT_DIRECTLY
          value_encoding: none
          source_enum: 5
          source: socket_input
        - source_enum: 7
          stage_enum: 0
          source: script_input
          stage: pre_process
          id: background
          ordinal: 2
          name: runFifos.py /opt/stonesoup/workspace/testData/fifo1 /opt/stonesoup/workspace/testData/fifo2
    - inputs:
        - value: 6000000 /opt/stonesoup/workspace/testData/file1 /opt/stonesoup/workspace/testData/file2 1,_2,_skip_to_my_lou
          value_encoding: none
          value_type: USE_TEXT_DIRECTLY
          source: socket_input
          source_enum: 5
          value_type_enum: 0
          stage: co_process
          stage_enum: 1
          id: source
          ordinal: 1
          address: ss-localhost
          port: 8887
        - source: file_content_input
          name: /opt/stonesoup/workspace/testData/file1
          ordinal: 2
          stage_enum: 0
          source_enum: 3
          stage: pre_process
        - stage: pre_process
          name: /opt/stonesoup/workspace/testData/file2
          stage_enum: 0
          source: file_content_input
          ordinal: 3
          source_enum: 3
  exploits:
    - inputs:
        - value_type_enum: 0
          source_enum: 5
          ordinal: 1
          stage: co_process
          stage_enum: 1
          source: socket_input
          value_encoding: none
          address: ss-localhost
          port: 8887
          id: source
          value_type: USE_TEXT_DIRECTLY
          value: 508 /opt/stonesoup/workspace/testData/fifo1 /opt/stonesoup/workspace/testData/fifo2 As_he_lay_watching_the_fireflies_over_head,_he_couldn't_shake_the_feeling_that_maybe_it_was_they_who_were_watching_him.
        - source_enum: 7
          name: runFifos.py /opt/stonesoup/workspace/testData/fifo1 /opt/stonesoup/workspace/testData/fifo2
          source: script_input
          stage_enum: 0
          stage: pre_process
          id: background
          ordinal: 2
    - inputs:
        - source_enum: 5
          value_type: USE_TEXT_DIRECTLY
          value: 99 /opt/stonesoup/workspace/testData/fifo1 /opt/stonesoup/workspace/testData/fifo2 Answering_question_after_question,_our_unlikely_hero_was_finally_winning_the_scholastic_challenge_for_us.
          value_encoding: none
          value_type_enum: 0
          stage: co_process
          stage_enum: 1
          address: ss-localhost
          id: source
          port: 8887
          ordinal: 1
          source: socket_input
        - source_enum: 7
          id: background
          stage_enum: 0
          source: script_input
          name: runFifos.py /opt/stonesoup/workspace/testData/fifo1 /opt/stonesoup/workspace/testData/fifo2
          ordinal: 2
          stage: pre_process
code_complexity_features:
  - file_name: /tmp/tmp9pbhR1_ss_testcase/src-rose/src/backend/storage/buffer/bufmgr.c
    function_name: stonesoup_handle_taint
    line_number: 0
    feature_group: source_taint
    feature: SOCKET
  - file_name: /tmp/tmp9pbhR1_ss_testcase/src-rose/src/backend/storage/buffer/bufmgr.c
    feature_group: data_type
    function_name: stonesoup_handle_taint
    line_number: 0
    feature: array
  - file_name: /tmp/tmp9pbhR1_ss_testcase/src-rose/src/backend/storage/buffer/bufmgr.c
    function_name: stonesoup_handle_taint
    line_number: 0
    feature_group: data_flow
